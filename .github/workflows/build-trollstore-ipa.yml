name: Build TrollStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build dependencies
        run: |
          brew install ldid
          pod install

      - name: Build, sign, and verify TrollStore IPA
        run: scripts/build_trollstore_ipa.sh "$RUNNER_TEMP/headunitpad-ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPA
          path: ${{ runner.temp }}/headunitpad-ipa/HeadunitPad.ipa
          if-no-files-found: error

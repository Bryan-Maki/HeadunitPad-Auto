continuation_notes:
  - Do not enable or start a new USB session before cleanupUSBResources has awaited the previous retained host's stop; that race caused the failed second connection.
  - USBAccessoryConnection now has a production creation/injection path through ConnectionManager.startUSBProbe; do not restore the former endpoint-only success behavior.
  - A successful physical run changes diagnostics to Connected via USB; failures retain the exact last handshake stage and USB error for copy/paste.
  - Keep AapTransport transport-neutral in task 3; create and own TrollUSBHostKit-backed objects at the connection-orchestration boundary.
  - ConnectionManager still owns the concrete TcpHandler only for TCP-specific connect/adopt/accept orchestration.
  - ByteStreamConnection is the only active AAP byte-stream abstraction; do not restore the removed blocking adapters.
  - Detach during START response is optional: No means request 53 returned normally; successful re-enumeration is independently proven when the later accessory device appears.
  - Phase 2 physical evidence is complete; do not request another AOA-only probe unless a regression is introduced.
  - The user explicitly approved the third entitlement and PRD.md now records it as required.
  - The entitlement verifier asserts all three keys in both the build product and packaged executable.
  - Interpret an empty IORegistry summary as a physical attachment, data-cable, hub/power, or USB-role problem; an IORegistry entry with zero libusb devices points to the TrollUSBHostKit/libusb access path.
  - Read the four source-of-truth files in order before recording the physical validation.
  - Keep USB work off the UI main thread when device access is introduced.
  - Treat an immediate detach after request 53 as waiting for re-enumeration, not as a failed START.
  - Preserve the AOAModeSwitcher result fields for VID/PID, bus/address, protocol version, interface, and endpoints when adding diagnostics.
  - The physical test UI is on the main screen; use Copy Diagnostics in the result alert or Settings > Diagnostics.
  - Do not start Phase 3 until the physical Phase 2 evidence is recorded or a hardware failure is diagnosed.
  - Do not treat simulator launch or ldid readback as physical USB Host verification.
  - Keep TrollUSBHostKit pinned to remote v0.1.3 and do not vendor libusb; 0.1.3 is the first release exposing resetDevice().
  - Reach for resetDevice() first for any "make the phone start over" problem. Re-sending AOA to a phone already in accessory mode and raw SET_CONFIGURATION were both proved useless on hardware.
  - Re-enumeration returns the phone in normal mode, not accessory mode; the restart path must fall back into cold-start negotiation rather than waiting for an accessory device.
  - Trust an observed detach, never an inferred one. didReenumerateAfterStart only mirrored didSendStart and cost three rounds of misdiagnosis.
  - The renderer must never drop a frame carrying NAL type 7 or 8: the stream sends parameter sets once, and losing them makes every later frame undecodable.

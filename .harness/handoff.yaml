session_summary: >-
  Phase 3 is complete. The wired path now reaches running, renders video, and
  survives an app-initiated disconnect followed by a reconnect, all confirmed on
  the physical Xiaomi 14T Pro. Two defects closed it out. First, the black screen
  was never a parsing problem: renderer counters showed 488 input frames, zero
  SPS/PPS, and 462 missing-config drops, because the pending-frame queue's
  overflow policy protected IDR frames only and discarded the stream's single
  parameter-set frame; the policy now protects NAL types 5, 7, and 8. Second,
  reconnect failed because the phone never released its previous Android Auto
  session, which was proved by an AAP trace type of 5891, a TLS
  application-data record header arriving where a plaintext message was
  expected. Re-sending the full AOA sequence to a phone already in accessory
  mode turned out to be a no-op, and a raw SET_CONFIGURATION control transfer
  was rejected by iOS, so TrollUSBHostKit v0.1.3 now exposes resetDevice() over
  USBDeviceReEnumerate. The phone sees that as an unplug, returns in normal
  mode, and goes through ordinary cold-start negotiation. Both repositories are
  committed; TrollUSBHostKit 0.1.3 is published and resolved from GitHub.

completed_this_session:
  - Changed the renderer's queue-overflow policy to protect any frame carrying NAL type 5, 7, or 8 so the stream's only SPS/PPS frame can no longer be discarded under pressure.
  - Allowed the pending queue to grow to twelve while every queued frame is essential, and added a renderer queue-drop counter to make the loss observable.
  - Changed the external watchdog recovery request to ignore the recent-packet guard, which had silently suppressed every attempt while undecodable packets kept arriving.
  - Added a bounded stale-input drain that waits for the bulk IN pipe to fall quiet across bursts before the handshake starts, with drained-byte and budget-exhausted diagnostics.
  - Added a wired handshake profile of fifteen version attempts across forty seconds, leaving the network profile unchanged.
  - Threaded a write completion through send/sendEncryptedMessage so the byebye can no longer be cancelled by the teardown it announces; the response wait now starts only once the write reaches the wire.
  - Kept a teardown summary for the last transport that actually reached running so a failed reconnect no longer overwrites the evidence explaining it.
  - Replaced the inferred re-enumeration diagnostic, which only mirrored didSendStart, with an observed accessory detach.
  - Added a SET_CONFIGURATION fallback and recorded its hardware rejection, then added device re-enumeration as the first-choice restart mechanism.
  - Modelled the restart result as restarted, rescan, or unchanged so a phone that returns in normal mode falls back into cold-start negotiation instead of waiting for an accessory that will never appear.
  - Changed the failure message to tell the user to unplug and replug when the phone never releases the accessory.
  - Published TrollUSBHostKit v0.1.3 with uhs_reset_device and USBDeviceSession.resetDevice(), treating NO_DEVICE and NOT_FOUND as success because a re-enumerated device no longer resolves through the old handle.
  - Committed both repositories and moved HeadunitPad from a local package override back to the published 0.1.3 dependency.
  - Recorded prior task-3 work below.
  - Added AOAPreparedAccessory so a successful AOA switch can transfer ownership of the reopened accessory session and running USB host to connection orchestration.
  - Added prepareFirstAvailableAccessory while retaining the Phase 2 probe-only method for its existing diagnostics tests.
  - Changed ConnectionManager's wired button path from endpoint-only probing to USBAccessoryConnection creation, interface claim, and injection into AapTransport.
  - Reused the existing AAP version, TLS, authentication, binding, media, input, microphone, and location implementation without adding a USB-specific AAP copy.
  - Added visible wired state updates for version negotiation, TLS, authentication, binding, running, cancellation, failure, and disconnect.
  - Added cleanup that stops the retained USB host and restores a fresh TCP-backed AapTransport after the wired session ends.
  - Renamed Test Wired USB to Connect Wired USB and kept a cancellable UI entry visible during USB discovery.
  - Added a prepared-accessory ownership regression test proving the host stays started until explicit close.
  - Produced .build/TrollStoreIPA/HeadunitPad.ipa for physical Phase 3 validation.
  - Recorded the physical Xiaomi result: ordinary mode to accessory mode succeeded, AAP reached Connected via USB, and audio played.
  - Recorded the remaining physical defect: no visible video despite the running session and working audio.
  - Changed first-frame tracking to advance only after AVSampleBufferDisplayLayer accepts a decoded sample rather than when raw H.264 bytes arrive.
  - Recorded that the next physical build still had no picture and self-disconnected about one to two seconds after reaching Connected via USB.
  - Reverted the aggressive external-watchdog video recovery request while retaining renderer-aware first-frame tracking.
  - Added AAP video packet, completed-frame, last-completed-frame byte counters, and recent video-channel trace to Diagnostics.
  - Persisted AAP video diagnostics before USB teardown and changed the automatic alert's Copy Diagnostics action to fetch the complete current diagnostic report.
  - Added a regression test for retaining saved AAP video evidence after disconnect.
  - Recorded physical confirmation that Android Auto video is now visible over the wired connection.
  - Recorded that user disconnect followed by reconnect fails before AAP running even though the second attempt reaches accessory interface 0 and receives encrypted video-channel packets.
  - Added ConnectionState.disconnecting and kept all reconnect controls unavailable through bulk cancellation, interface release, session close, and USB Host stop.
  - Delayed TCP transport restoration and Ready to connect until the complete USB cleanup barrier finishes.
  - Recorded that the cleanup-barrier build reconnects to AAP running but displays black despite 743 video packets, 440 completed frames, and a 4986-byte last frame.
  - Confirmed HeadunitPad previously only answered phone-originated BYEBYE_REQUEST and did not send one for user disconnect.
  - Added encrypted control-channel BYEBYE_REQUEST with USER_SELECTION reason, BYEBYE_RESPONSE completion, and a 250-millisecond fallback.
  - Added AAP graceful-disconnect diagnostics and an exact serialized-frame regression test.
  - Recorded that the graceful-disconnect build can detach before running when already in accessory mode; a fresh AOA run reached running but stayed black and later self-detached.
  - Recorded 767 video packets, 446 completed frames, and a 4770-byte last frame on that black session; graceful disconnect was Not requested because the phone/USB ended it.
  - Marked AVSampleBufferDisplayLayer samples DisplayImmediately for live-stream rendering independent of stale session timestamps.
  - Added complete renderer-stage diagnostics and AAP recovery-request/peer-BYEBYE diagnostics to every copyable report.
  - Recorded the definitive black-screen result: 600 video packets, 287 complete frames, zero SPS/PPS, zero format/sample/enqueue, and 259 missing-config drops.
  - Confirmed zero watchdog recovery requests and no peer BYEBYE during that running session.
  - Added a shared H.264 parser for Annex-B, avcC, length-prefixed NALs, and AAP type/timestamp prefixes.
  - Normalized non-Annex-B SPS/PPS to Annex-B in AapTransport before renderer delivery and added three focused parser tests.
  - Recorded a stable-but-black physical session with 809 packets, 561 frames, zero SPS/PPS, and 533 missing-config drops.
  - Recorded the eventual physical detach after 2721 packets, 2426 frames, and five external-watchdog recovery requests while codec configuration remained absent.
  - Preserved media type 1 for first/single encrypted video packets and inherited that type across codec-config continuation fragments.
  - Routed fully assembled codec configuration through the shared normalization path rather than delivering it as an ordinary frame.
  - Prioritized avcC and length-prefix parsing over Annex-B to avoid a false start code spanning a zero AAP timestamp and avcC's leading 0x01.
  - Added video data/config message counts, last codec-config prefix diagnostics, and per-handshake reset of video assembly/recovery state.
  - Added USBAccessoryConnection as a non-blocking ByteStreamConnection over an injectable USB accessory session.
  - Added asynchronous interface claim/release and continuous bulk IN reads without blocking the UI main actor.
  - Preserved non-empty partial read data recovered from timeout and continued cleanly after zero-byte timeouts.
  - Added serialized bulk OUT writes with per-write completion and ordered delivery.
  - Added idempotent detach and active disconnect cleanup that cancels transfers, releases the interface, closes the session, fails queued writes, and emits one disconnect callback.
  - Added five USB accessory lifecycle tests for endpoint validation, claim/read/release, ordered writes, detach, and in-flight/queued cancellation.
  - Marked TcpHandler as unchecked Sendable after moving the shared transport callback boundary off the default UI actor; its existing serial Network.framework queue remains unchanged.
  - Recorded the user's physical regression result that both wired AOA probing and wireless Android Auto remain normal.
  - Added ByteStreamConnection and ByteStreamConnectionDelegate for state, send, disconnect, and connect/receive/disconnect callbacks.
  - Migrated AapTransport from a concrete TcpHandler dependency to the shared byte-stream boundary.
  - Migrated TcpHandler callbacks to ByteStreamConnectionDelegate without changing connect/adopt/accept entry points used by ConnectionManager.
  - Removed the dead ConnectionManager TcpHandlerDelegate extension.
  - Removed unused AccessoryConnection, TcpAccessoryConnection, and TcpConnection implementations to retain one transport abstraction.
  - Added protocol lifecycle and Network.framework loopback TCP regression tests.
  - Closed the Phase 2 physical gate using the user's complete ordinary-mode-to-accessory-mode diagnostics.
  - Recorded source 0x2717:0xFF08 at bus/address 0/1, AOA protocol 2, and START sent successfully.
  - Recorded accessory 0x18D1:0x2D01 at bus/address 0/1, interface 0, bulk IN 0x81, and bulk OUT 0x01.
  - Clarified the misleading Detach after START field into Detach during START response and added Re-enumeration after START.
  - Added a regression test for a normal START response followed by successful re-enumeration.
  - Recorded the successful physical accessory-mode probe at 0x18D1:0x2D01, interface 0, bulk IN 0x81, and bulk OUT 0x01.
  - Determined that source/protocol/START/detach remained unknown because the phone was already in accessory mode before this probe began.
  - Diagnosed the phone's no-installed-app generic USB accessory dialog as a mismatch caused by HeadunitPad's custom AOA identity strings.
  - Updated PRD.md and AOAIdentity to the Android Auto head-unit identity: Android, Android Auto, Android Auto, 2.0.1, the Android Auto developer URI, and HU-AAAAAA001.
  - Added a test that verifies the exact identity values and all six NUL-terminated request 52 payloads.
  - Rebuilt the three-entitlement TrollStore IPA and installed/launched the simulator build.
  - Updated PRD.md section 5 and the Phase 1 gate from two to three required USB Host entitlements after user approval.
  - Added com.apple.system.diagnostics.iokit-properties=true to HeadunitPad.entitlements.
  - Extended build_trollstore_ipa.sh to fail if the new entitlement is absent from either the signed build product or packaged executable.
  - Produced a new TrollStore IPA with all three entitlements embedded and verified.
  - Recorded the second physical diagnostic: both IOUSBHostDevice and IOUSBHostInterface exist for Xiaomi 14T Pro, proving physical attachment and USB role negotiation.
  - Confirmed the registry returns no idVendor/idProduct numbers and libusb returns zero devices, so failure is below AOA and above physical attachment.
  - Compared packaged entitlement requirements with the same-hardware iPadADB project; iPadADB's proven configuration includes com.apple.system.diagnostics.iokit-properties in addition to the two HeadunitPad entitlements.
  - Stopped before modifying signing requirements because PRD.md section 5 explicitly limits HeadunitPad to the current two entitlements.
  - Recorded the user's first physical probe result: zero enumerated USB devices, no source VID/PID, and no AOA GET_PROTOCOL or START attempt.
  - Added an enumerated USB device count to copyable diagnostics.
  - Added USBHostController registrySummary capture on both success and failure paths, independent of libusb enumeration.
  - Added a regression test proving no-device failures still emit IORegistry diagnostics before host cleanup.
  - Added the main-screen Test Wired USB button below Enter IP Manually and retained the existing connection-mode behavior.
  - Added ConnectionManager-owned USB probe lifecycle, cancellation, live UI state, and result/error delivery.
  - Added stage reporting for search, initial enumeration, negotiation, protocol version, identity, START, detach, re-enumeration, accessory readiness, and libusb log capture.
  - Added AOAProbeDiagnostics with copyable connection kind, VID/PID, bus/address, protocol version, START/detach, interface, bulk IN/OUT, error, and libusb fields.
  - Added understandable error descriptions and preserved permission, control-transfer timeout, and pre-START detach errors.
  - Added three diagnostics/stage/error tests; the complete AndroidOpenAccessoryTests suite now has thirteen passing tests.
  - Installed and launched the updated simulator build and visually checked the new button layout.
  - Built .build/TrollStoreIPA/HeadunitPad.ipa and verified its executable entitlements after packaging.
  - Added AOAUSBDevice, interface, and endpoint snapshots with Google accessory VID/PID recognition and same-interface bulk endpoint selection.
  - Added TrollUSBHost as the production adapter over USBHostController start, probe, open, and stop operations.
  - Added AOAModeSwitcher candidate enumeration, AOA negotiation, bounded re-enumeration polling, cancellation, and lifecycle cleanup.
  - Treated USBHostError.disconnected from request 53 as a successful START that proceeds to re-enumeration.
  - Added four mode-switch tests plus a START-detach negotiation test, bringing the AOA test suite to ten tests.
  - Corrected re-enumeration timeout propagation so it is not collapsed into noAOACapableDevice.
  - Added AOAIdentity, indexed AOA string requests, GET_PROTOCOL and START requests, little-endian protocol parsing, and explicit protocol errors.
  - Added AOANegotiator with an injectable async control-transfer boundary and USBDeviceSession conformance.
  - Added a standalone HeadunitPadTests target and shared HeadunitPad scheme without coupling the pure AOA tests to the app's OpenSSL dependency.
  - Added six unit tests for the complete request 51/52/53 model and execution sequence.
  - Confirmed the project-local .build/TrollStoreIPA/HeadunitPad.ipa installed through TrollStore, launched without a crash, and retained existing functionality.
  - Copied the verified artifact to .build/TrollStoreIPA/HeadunitPad.ipa for manual TrollStore installation.
  - Recorded the user's physical-iPad test report: TrollStore installation succeeded, the app did not crash, and existing functionality was unchanged.
  - Added HeadunitPad.entitlements with only the two USB Host entitlement keys required by TrollUSBHostKit.
  - Set CODE_SIGN_ENTITLEMENTS for the HeadunitPad Debug and Release configurations.
  - Added scripts/build_trollstore_ipa.sh for unsigned build, ldid signing, entitlement assertions, packaging, and post-package verification.
  - Updated the GitHub Actions workflow to install ldid, run the shared script, and fail if the IPA is missing.
  - Produced and verified a local HeadunitPad.ipa.
  - Installed and launched the simulator build to check application startup.


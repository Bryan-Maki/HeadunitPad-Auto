known_issues_and_risks:
  - The workflow logic passed locally but has not yet run on a GitHub-hosted macOS runner.
  - Reconnect depends on USBDeviceReEnumerate, which the USB host user client gates behind kUSBHostUserClientPropertyEnableReset; if it is ever refused there is no software alternative and the user must replug.
  - Repeated unplug/replug and long-session stability are unproven; only one disconnect/reconnect cycle has been physically verified.
  - HeadunitPad commit b067e5b is local to feature/trollusb and has not been pushed or opened as a pull request.
  - Use HeadunitPad.xcworkspace for app-integrated tests so CocoaPods OpenSSL is available.


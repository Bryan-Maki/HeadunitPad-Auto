phase_3_task_1_archive:
  completed:
    - Added a single non-blocking ByteStreamConnection protocol with connection state, send, disconnect, and connect/receive/disconnect callbacks.
    - Changed AapTransport to depend only on ByteStreamConnection and removed every direct TcpHandler reference from the AAP layer.
    - Made TcpHandler conform to the shared boundary while retaining its existing outbound, prepared-connection, and accepted-connection entry points.
    - Removed the unused blocking AccessoryConnection/TcpAccessoryConnection adapter and unused TcpConnection implementation so no competing transport abstraction remains.
    - Removed the dead ConnectionManager TcpHandlerDelegate extension; AapTransport remains the sole byte-stream callback consumer.
    - Added deterministic protocol lifecycle coverage and a Network.framework loopback TCP bidirectional transfer regression test.
  verification:
    - Eighteen tests passed: sixteen AOA/diagnostics tests plus two byte-stream/TCP tests.
    - The TCP loopback test verified connect callback, client-to-server bytes, server-to-client bytes, and send completion.
    - Generic iOS device Debug build passed at arm64-apple-ios16.6 with signing disabled.
    - Simulator install and launch succeeded with process id 32327.
    - compileall, plist/scheme, shell syntax, and git diff checks passed.

phase_2_task_3_archive:
  completed:
    - Added a main-screen Test Wired USB button with live stage text, cancellation, and success/failure result alerts.
    - Connected the UI to AOAModeSwitcher without changing connection modes or starting the wireless discovery path.
    - Added copyable diagnostics for source/accessory VID/PID, bus/address, AOA protocol version, START/detach, interface, bulk endpoints, errors, and available libusb log.
    - Added user-facing USB permission, no-device, unsupported-AOA, detach, and timeout descriptions.
    - Recorded the first physical probe: libusb enumerated zero devices, so failure occurred before AOA request 51.
    - Added the enumerated-device count and direct IORegistry USB summary so the next physical run can distinguish attachment/USB-role failure from libusb visibility failure.
    - Recorded the second physical probe: IORegistry sees Xiaomi 14T Pro and ADB Interface, but device properties including idVendor/idProduct are unavailable and libusb enumerates zero devices.
    - Isolated the only signing difference from the previously working iPadADB build: iPadADB includes com.apple.system.diagnostics.iokit-properties while HeadunitPad and its PRD allow only the other two USB Host entitlements.
    - With user approval, updated the PRD and added com.apple.system.diagnostics.iokit-properties to the app entitlement set.
    - Updated the shared IPA packager to reject build products or packaged executables missing the third entitlement.
    - Built a new entitlement-verified TrollStore IPA for physical validation.
    - Recorded a successful physical accessory-mode probe at 0x18D1:0x2D01 with interface 0 and bulk IN/OUT endpoints 0x81/0x01, confirming that the entitlement and libusb enumeration repair works.
    - Diagnosed the Android generic-accessory dialog as an AOA identity mismatch and replaced the custom HeadunitPad identity with the Android Auto head-unit profile used by established DHU implementations.
    - Added a regression test for all six Android Auto identity strings and rebuilt the TrollStore IPA.
    - Recorded the complete ordinary-mode physical sequence from Xiaomi 0x2717:0xFF08 through AOA protocol 2 and START to Google accessory 0x18D1:0x2D01 with interface 0 and bulk endpoints 0x81/0x01.
    - Clarified diagnostics so an early detach during the START response is distinct from the required post-START accessory re-enumeration.
  verification:
    - Fourteen AndroidOpenAccessoryTests passed on the iPad simulator.
    - Release generic iOS device build and TrollStore IPA packaging passed.
    - Simulator install and launch succeeded; visual inspection confirmed the Test Wired USB button is visible without overlap.
    - Second physical probe proved the cable and USB role reach IOUSBHostDevice; failure remains before AOA GET_PROTOCOL because libusb cannot construct an enumerable device from the restricted registry properties.
    - User approved the requirement correction; fourteen AOA tests, Release packaging, three-entitlement readback, and simulator launch passed.
    - Fifteen AndroidOpenAccessoryTests passed after the Android Auto identity correction.
    - Updated Release IPA packaging and three-entitlement readback passed; simulator installation and launch returned process id 21718.
    - User physical validation passed the Phase 2 gate from ordinary USB mode through accessory endpoint discovery without a crash.
    - Sixteen AndroidOpenAccessoryTests passed after clarifying START detach and re-enumeration diagnostics; the final Release IPA packaging and entitlement readback passed.
    - Final simulator installation and application launch succeeded with process id 27299; compileall and configuration validation passed.

completed:
  - id: phase_3_task_3
    summary: >-
      Injected the USB accessory connection into the shared AapTransport and
      closed the two defects that kept the wired path unusable: the renderer
      discarded the stream's only SPS/PPS frame under queue pressure, and a
      reconnect could not start because the phone never released its previous
      Android Auto session. The reconnect now re-enumerates the device through
      TrollUSBHostKit 0.1.3, which the phone sees as an unplug.
    verification:
      - User physical validation: video visible over USB, and an app-initiated disconnect followed by a reconnect reaches running.
      - Renderer counters proved the cause before the fix: 488 input frames, 0 SPS/PPS, 462 missing-config drops, and 26 frames lost to queue overflow.
      - Reconnect diagnosis proved each dead end on hardware: repeated AOA is a no-op, SET_CONFIGURATION is rejected with LIBUSB_ERROR_OTHER, and only re-enumeration works.
      - Full HeadunitPadTests suite and TrollUSBHostKit 26/26 passed; Release TrollStore packaging and three-entitlement readback passed.
  - id: phase_3_task_2
    summary: >-
      Implemented the USB accessory byte-stream connection with asynchronous
      interface claim, continuous bulk reads, serialized bulk writes, and safe
      detach/cancel cleanup without coupling AapTransport to USBHostKit.
    verification:
      - Twenty-three simulator tests passed, including five USB accessory lifecycle tests.
      - Generic iOS device Debug build passed and simulator launch returned process id 42233.
      - User confirmed the existing wired probe and wireless Android Auto paths both remain normal.
  - id: phase_3_task_1
    summary: >-
      Added the shared non-blocking byte-stream connection boundary, migrated
      AapTransport and TcpHandler to it, and removed unused competing TCP and
      blocking accessory connection abstractions.
    verification:
      - Eighteen simulator tests passed, including a real loopback TCP bidirectional transfer regression.
      - Generic iOS device Debug build passed at arm64-apple-ios16.6.
      - Simulator install and launch returned process id 32327.
  - id: phase_2_task_3
    summary: >-
      Added the USB probe UI and copyable diagnostics, repaired physical libusb
      enumeration with the required IOKit property entitlement, corrected the
      AOA identity to Android Auto, and clarified START-response detach versus
      successful accessory re-enumeration.
    verification:
      - Physical Xiaomi probe started at 0x2717:0xFF08, reported AOA protocol 2, sent START, and reached 0x18D1:0x2D01.
      - Physical accessory interface 0 exposed bulk IN 0x81 and bulk OUT 0x01.
      - Sixteen AndroidOpenAccessoryTests, Release TrollStore packaging, and three-entitlement readback passed.

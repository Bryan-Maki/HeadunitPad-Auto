    summary: >-
      Added a TrollUSBHostKit-backed mode switcher that starts and stops USB Host
      discovery, snapshots connected devices, opens candidates for AOA negotiation,
      accepts detach during START, waits for Google accessory re-enumeration, and
      selects a same-interface bulk IN/OUT endpoint pair without claiming it.
    verification:
      - Ten AndroidOpenAccessoryTests passed on the iPad simulator.
      - Tests cover START-time detach, accessory re-enumeration, already-enumerated accessories, endpoint selection, timeout classification, and host lifecycle cleanup.
      - HeadunitPad generic iOS device Debug build passed at arm64-apple-ios16.6.
  - id: phase_2_task_1
    summary: >-
      Added non-main-actor AOA identity and control-request models, the ordered
      GET_PROTOCOL/SEND_STRING/START sequence, protocol-version parsing, and an
      injectable async negotiator that can use USBDeviceSession without device enumeration.
    verification:
      - Six AndroidOpenAccessoryTests passed on the iPad simulator.
      - Tests cover request order and fields, all six string indexes, NUL-terminated UTF-8 payloads, little-endian protocol parsing, invalid response length, the full transfer sequence, and protocol version zero rejection.
      - HeadunitPad generic iOS device Debug build passed at arm64-apple-ios16.6.
  - id: phase_1_task_2
    summary: >-

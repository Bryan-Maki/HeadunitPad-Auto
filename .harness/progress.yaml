known_risks:
  - The updated GitHub Actions workflow was validated locally but has not yet run on GitHub-hosted macOS.
  - Reconnect depends on USBDeviceReEnumerate, which the USB host user client gates behind kUSBHostUserClientPropertyEnableReset; if a future iOS build refuses it there is no software alternative and the user must replug.
  - Repeated unplug/replug and long-session stability are unproven; only a single disconnect/reconnect cycle has been physically verified.
  - HeadunitPad commit b067e5b is local to feature/trollusb and has not been pushed or opened as a pull request.
  - The existing allowBluetooth deprecation warning remains unrelated to this task.


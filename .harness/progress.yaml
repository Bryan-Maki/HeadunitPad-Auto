phase_3_task_3_archive:
  completed:
    - Added an AOA prepared-accessory ownership path that keeps USBHostController and the reopened accessory session alive after endpoint discovery.
    - ConnectionManager now creates USBAccessoryConnection from the prepared interface/endpoints and injects it into the existing transport-neutral AapTransport.
    - The wired path now advances through the existing AAP version, TLS, authentication, binding, and running state machine without duplicating protocol or media logic.
    - Added wired handshake status reporting for version negotiation, TLS, authentication, service binding, running, failure, cancellation, and disconnect.
    - Added USB cleanup and TCP transport restoration after failure, cancellation, detach, or explicit disconnect.
    - Renamed the visible entry point to Connect Wired USB and exposed cancellation while USB discovery is active.
    - Added a regression test proving the prepared accessory host remains alive until ownership is explicitly closed.
    - Recorded physical proof that USB reaches AAP running and carries working audio on the Xiaomi phone.
    - Changed black-screen detection so the watchdog tracks frames actually enqueued by the renderer instead of merely received H.264 payloads.
    - Recorded the next physical result: the recovery build still had no picture and the wired AAP session disconnected by itself about one to two seconds after reaching Connected via USB.
    - Reverted the aggressive external-watchdog recovery request because the short-session regression appeared only after that wire behavior was introduced; renderer-aware first-frame tracking remains.
    - Added AAP video packet, completed-frame, last-frame-size, and recent video-channel trace lines to diagnostics, persisting them before USB release without showing a second all-zero transport snapshot.
    - Changed the result alert and Copy Diagnostics action to read the complete live ConnectionManager diagnostics instead of a USB-only or stale snapshot.
    - Added a regression test proving persisted AAP video evidence remains present after the active transport is gone.
    - Recorded physical confirmation that the reverted-recovery build connects and displays Android Auto video successfully.
    - Recorded the remaining reconnect defect: after the user selects disconnect, the next wired attempt claims the accessory endpoints and receives encrypted video-channel packets but disconnects before AAP running.
    - Added an explicit disconnecting state and now keeps reconnect controls unavailable until bulk tasks finish, the interface/session close, and the retained USB Host controller has fully stopped.
    - Restores the TCP transport and re-enables the wired connection button only after the complete USB cleanup barrier finishes.
    - Recorded the cleanup-barrier physical result: the next session now reaches AAP running instead of disconnecting, but remains black despite 743 video packets and 440 completed H.264 frames.
    - Confirmed the user-disconnect path previously sent no AAP BYEBYE_REQUEST; it only closed the USB transport after local cleanup began.
    - Added an encrypted control-channel BYEBYE_REQUEST with USER_SELECTION reason for user-initiated wired disconnects, handling BYEBYE_RESPONSE and falling back to forced cleanup after 250 milliseconds.
    - Added copyable graceful-disconnect result diagnostics and a pure framing test for the exact control message bytes.
    - Recorded the graceful-disconnect build's physical result: an already-accessory reconnect detached before AAP running, while a fresh ordinary-mode attempt reached running but stayed black and later detached by itself.
    - Recorded 767 video packets, 446 completed H.264 frames, a 4770-byte last frame, and no user-initiated BYEBYE on the self-detaching session.
    - Marked live H.264 samples with kCMSampleAttachmentKey_DisplayImmediately so AVSampleBufferDisplayLayer does not depend on stale presentation timestamps across sessions.
    - Added renderer diagnostics for input/parsed frames, SPS/PPS, IDR, format creation, sample buffers, enqueue readiness, layer failures, final NAL types, display status, and display error.
    - Added AAP diagnostics for actual video-recovery request count/reason and phone-originated BYEBYE reason so repeated setup responses are no longer mistaken for watchdog activity.
    - Recorded definitive renderer evidence from the next physical run: 600 AAP video packets and 287 completed frames reached the app, but the renderer saw zero SPS/PPS, created zero format descriptions/sample buffers, enqueued zero samples, and dropped 259 frames for missing config.
    - Confirmed the watchdog sent zero recovery requests and the phone sent no BYEBYE during that connected black session.
    - Added H264NALParser to recognize Annex-B, AVCDecoderConfigurationRecord, two/four-byte length-prefixed NALs, and AAP type/timestamp prefixes.
    - Normalizes non-Annex-B SPS/PPS into Annex-B inside AapTransport before delivering codec configuration to the renderer.
    - Replaced renderer-only Annex-B splitting with the shared parser and added three codec-config format regression tests.
    - Recorded the next physical run: the session remained connected while receiving 809 packets and 561 frames, but still had zero SPS/PPS and dropped 533 parsed frames before format creation.
    - Recorded the longer physical run: after 2721 packets and 2426 frames without renderer configuration, the external watchdog sent five recovery requests and the USB session eventually detached.
    - Preserved AAP video media type 1 on first/single encrypted packets instead of collapsing codec configuration into type 0 frame data.
    - Added fragmented codec-config assembly that inherits the first fragment's media type and normalizes the completed payload before renderer delivery.
    - Changed H.264 format detection to parse self-describing avcC and length-prefixed data before Annex-B, preventing a zero timestamp plus avcC's leading byte from creating a false start code.
    - Added copyable video data/config message counts and the last codec-config prefix, and resets media assembly/watchdog state for each handshake.
    - Found the real black-screen cause from renderer counters: the pending-frame queue dropped the stream's only SPS/PPS frame under pressure because the overflow policy protected IDR frames alone.
    - Changed the overflow policy to protect any frame carrying NAL type 5, 7, or 8, let the queue grow to twelve while every frame is essential, and added a renderer queue-drop counter.
    - Changed the external watchdog request to ignore the recent-packet guard, which had been silently suppressing every recovery attempt while undecodable packets kept arriving.
    - Recorded physical confirmation that video is now visible over USB.
    - Diagnosed the reconnect failure from an AAP trace type of 5891 (0x1703, a TLS application-data record header): the phone was still writing its previous session's encrypted stream into the pipe.
    - Added a bounded stale-input drain that waits for the bulk IN pipe to fall quiet across bursts before the handshake starts, with drained-byte and budget-exhausted diagnostics.
    - Added a wired handshake profile with fifteen version attempts over a forty-second window so a phone rebuilding its accessory function is not abandoned early.
    - Fixed the graceful disconnect: the byebye write could be cancelled by the teardown it announced, so the completion is now threaded through send/encrypt and the response wait starts only after the write reaches the wire.
    - Kept a teardown summary for the last session that actually reached running, so a failed reconnect no longer overwrites the evidence explaining it.
    - Replaced the inferred re-enumeration diagnostic, which only mirrored didSendStart, with an observed accessory detach.
    - Proved on hardware that re-sending the full AOA sequence to a phone already in accessory mode is a no-op, and that a raw SET_CONFIGURATION control transfer is rejected by iOS with LIBUSB_ERROR_OTHER.
    - Published TrollUSBHostKit v0.1.3 exposing USBDeviceSession.resetDevice() over libusb_reset_device and USBDeviceReEnumerate, the only mechanism that makes the phone see a detach.
    - Changed the reconnect path to re-enumerate first and modelled the result as restarted, rescan, or unchanged, because a re-enumerated phone returns in normal mode and must go through cold-start negotiation again.
    - Changed the failure message to tell the user to unplug and replug when the phone never releases the accessory.
  verification:
